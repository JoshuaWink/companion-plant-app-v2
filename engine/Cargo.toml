[package]
name = "companion-graph"
version = "0.1.0"
edition = "2021"
description = "Graph engine for companion planting relationships"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
